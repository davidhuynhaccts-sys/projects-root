name: Ding Daily Notifications

on:
  schedule:
    # Check every five minutes. Ding itself compares the current Central time
    # with the two saved notification times and de-duplicates each daily slot.
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ding:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Ding digest check
        run: curl --fail --silent --show-error --retry 2 https://projectsproject.com/ding/api/digest
